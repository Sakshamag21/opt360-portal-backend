apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator360-api
  namespace: strot-applications
  labels:
    app: operator360-api
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator360-api
      env: prod
  template:
    metadata:
      labels:
        app: operator360-api
        env: prod
    spec:
      containers:
      - name: operator360-api
        image: "harbor-registry-prod.uidai.gov.in/data-platform/operator360-api:1.0.0-RELEASE"
        imagePullPolicy: Always        
        stdin: true
        tty: true
        env:
        - name: http_proxy
          value: ""
        - name: PORT
          value: "8000"
        volumeMounts:
          - name: config-volume
            mountPath: /app/resources/config.yaml
            subPath: config.yaml
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: operator360-api
            defaultMode: 0755        
      restartPolicy: Always
